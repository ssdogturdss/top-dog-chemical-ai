version: "3.9"

# =============================================================================
# Top Dog Chemical AI — Docker Compose
# Starts: PostgreSQL + API server + Nginx (serving frontend + proxying API)
# =============================================================================
#
# Usage:
#   cp .env.example .env   # then fill in OPENAI_API_KEY, SESSION_SECRET, ADMIN_PASSWORD
#   docker compose up --build
#   open http://localhost:3000

services:

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: topdog
      POSTGRES_USER: topdog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-topdog_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topdog -d topdog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Database setup (push schema + seed, runs once then exits)
  # ---------------------------------------------------------------------------
  db-migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://topdog:${DB_PASSWORD:-topdog_dev_password}@db:5432/topdog
      NODE_ENV: production
    command: >
      sh -c "
        pnpm --filter @workspace/db run push &&
        pnpm --filter @workspace/db run seed
      "
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://topdog:${DB_PASSWORD:-topdog_dev_password}@db:5432/topdog
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-topdog}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      NODE_ENV: production
      PORT: 8080
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nginx — serves frontend static files and proxies /api to the API server
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount built frontend — Docker Compose needs it available at host level.
      # Run `pnpm build` first or build via the builder stage below.
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_dist:
